# Layout constraints for a white-line / floorplan sketch.
# Values marked ASK must be confirmed by analog/layout owner; UNKNOWN means no
# source has been provided. Do not invent PDK numbers.

module: <name>
source: <netlist path>
rules_source: <educational | pdk | company>   # default educational

devices:
  - name: <M1_DP>
    role: <input_pair>
    w_um: <number>
    l_um: <number>
    nf: <number>
    m: <number>
    total_w_um: <number>
    current_density: <ASK>
    scale_class: <small | medium | large>   # for readable sketches

dummies:
  DP:
    sides: both_w_ends
    count_per_side: <1>
    connection: source_drain_shared
    wl_policy: same_as_active
    wl_exception: "if W/L < 0.5: same W, minimum L"
    gate_tie: layout_independent
  CM:
    sides: both_w_ends
    count_per_side: <1>
    connection: source_drain_shared
    wl_policy: same_as_active
    wl_exception: "if W/L < 0.5: same W, minimum L"
    gate_tie: layout_independent
  TAIL:
    sides: both_w_ends
    count_per_side: <1>
    connection: source_drain_shared
    wl_policy: same_as_active
    wl_exception: "if W/L < 0.5: same W, minimum L"
    gate_tie: layout_independent

rings:
  rules_source: educational_placeholder
  shared_rings: false          # separate ring for each matched group
  DP:
    type: <ASK>                 # N+ / P+ / deep N-well / ...
    width_um: <ASK>
    contact_spacing_um: <ASK>
    ring_to_device_um: <ASK>
    ring_to_ring_um: <ASK>
  CM:
    type: <ASK>
    width_um: <ASK>
    ring_to_device_um: <ASK>

caps:
  C1_CC:
    type: MOSCAP                # non-high-precision OP default
    value_pf: 3
    density_stated: "<value + unit>"
    unit_check: "<confirm pF vs fF>"
    density_ff_per_um2: <ASK>   # not the generic 1.5 fF/um2
    voltage_coefficient: <ASK>
    linearity: <ASK>
    bottom_plate_parasitic: <ASK>

sizing:
  current_density_ua_per_um: <ASK>   # requires bias current / operating point
  size_class_basis: "total W/L + current; small/medium/large for readable sketch"
  note: "size_class is a drawing aid, not an electrical rule"

compactness:
  matched_group_rings: separate
  abutment:
    - <DP/CM share ring?>
  shared_rings: <ASK>
  vdd_trunk: <ASK>
  vss_trunk: <ASK>
  target_width_um: <ASK>
  target_height_um: <ASK>

open_questions:
  - <dummy count / gate tie>
  - <ring spacing source>
  - <MOSCAP density / linearity>
