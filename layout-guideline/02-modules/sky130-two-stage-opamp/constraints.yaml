module: sky130_two_stage_opamp
source: examples/sky130_two_stage_opamp/opamp.sp
rules_source: educational   # generic-180 only; no SKY130/company rule pack

devices:
  - {name: M1_DP, role: input_pair,     w_um: 0.75, l_um: 0.5, nf: 1, m: 1, total_w_um: 0.75,  scale_class: small}
  - {name: M2_DP, role: input_pair,     w_um: 0.75, l_um: 0.5, nf: 1, m: 1, total_w_um: 0.75,  scale_class: small}
  - {name: M3_CM, role: current_mirror, w_um: 0.75, l_um: 0.5, nf: 1, m: 1, total_w_um: 0.75,  scale_class: small}
  - {name: M4_CM, role: current_mirror, w_um: 0.75, l_um: 0.5, nf: 1, m: 1, total_w_um: 0.75,  scale_class: small}
  - {name: M5_TAIL, role: tail_current, w_um: 0.75, l_um: 0.5, nf: 1, m: 1, total_w_um: 0.75,  scale_class: small}
  - {name: M6_OUT, role: output_stage,  w_um: 8.5,  l_um: 0.5, nf: 2, m: 1, total_w_um: 17.0, scale_class: large}
  - {name: M7_OUT, role: output_stage,  w_um: 6.5,  l_um: 0.5, nf: 1, m: 1, total_w_um: 6.5,  scale_class: medium}
  - {name: M8_BIAS, role: bias,         w_um: 0.75, l_um: 0.5, nf: 1, m: 1, total_w_um: 0.75,  scale_class: small}
  - {name: M9_EN, role: enable_switch,  w_um: 2.0,  l_um: 0.5, nf: 1, m: 1, total_w_um: 2.0,  scale_class: small}
  - {name: M10_EN_PD, role: enable_switch, w_um: 1.0, l_um: 0.5, nf: 1, m: 1, total_w_um: 1.0, scale_class: small}

dummies:
  DP:
    sides: both_w_ends
    count_per_side: 1
    connection: source_drain_shared
    wl_policy: same_as_active
    wl_exception: "if W/L < 0.5: same W, minimum L"
    gate_tie: layout_independent
  CM:
    sides: both_w_ends
    count_per_side: 1
    connection: source_drain_shared
    wl_policy: same_as_active
    wl_exception: "if W/L < 0.5: same W, minimum L"
    gate_tie: layout_independent
  TAIL:
    sides: both_w_ends
    count_per_side: 1
    connection: source_drain_shared
    wl_policy: same_as_active
    wl_exception: "if W/L < 0.5: same W, minimum L"
    gate_tie: layout_independent

rings:
  rules_source: educational_placeholder
  shared_rings: false          # every matched group gets its own ring
  DP:
    separate: true
    type: educational_placeholder
    width_um: 1.0
    contact_spacing_um: ASK
    ring_to_device_um: 1.5
    ring_to_ring_um: ASK
  CM:
    separate: true
    type: educational_placeholder
    width_um: 1.0
    contact_spacing_um: ASK
    ring_to_device_um: 1.5
  TAIL:
    separate: true
    type: educational_placeholder
    width_um: 1.0
    ring_to_device_um: 1.5
  OUT:
    separate: true
    type: educational_placeholder
    width_um: 1.0
    ring_to_device_um: 1.5

caps:
  C1_CC:
    type: MOSCAP
    value_pf: 3
    density_stated: "2 pF/um2 (1x1 MOSCAP)"
    unit_check: "likely 2 fF/um2; 2 pF/um2 is ~200-1000x typical; confirm pF vs fF"
    density_ff_per_um2: ASK
    voltage_coefficient: ASK
    linearity: ASK
    bottom_plate_parasitic: ASK

sizing:
  current_density_ua_per_um: ASK
  size_class_basis: "total W/L + current; small/medium/large for readable sketch"
  note: "current density is not derivable from netlist alone; needs bias current and W/L"

compactness:
  matched_group_rings: separate
  abutment:
    - "DP/M1-M2: common-centroid, shared source node"
    - "CM/M3-M4: shared gate net, same well"
    - "TAIL/BIAS: M5/M8 mirror, keep close"
  shared_rings: ASK
  vdd_trunk: ASK
  vss_trunk: ASK
  target_width_um: ASK
  target_height_um: ASK

open_questions:
  - "confirm MOSCAP density unit: 2 pF/um2 or 2 fF/um2"
  - "ring contact spacing / ring-to-ring for educational placeholder"
  - "current density / bias current per branch"
  - "VDD/VSS trunk and abutment targets"
