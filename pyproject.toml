[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Analog2Layout"
version = "0.1.0"
description = "Role-aware schematic-to-layout handoff for analog circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Analog2Layout contributors" }]
keywords = ["analog", "layout", "EDA", "floorplan", "LLM", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/XIAHONGYUU/Analog2Layout"
Repository = "https://github.com/XIAHONGYUU/Analog2Layout"
Issues = "https://github.com/XIAHONGYUU/Analog2Layout/issues"

[project.scripts]
a2l = "a2l.cli:main"

[tool.setuptools]
packages = ["a2l"]
