<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="same area different floorplan variants">
<rect x="0" y="0" width="1200" height="560" rx="0" fill="#08111F" stroke="none" stroke-width="1"/>
