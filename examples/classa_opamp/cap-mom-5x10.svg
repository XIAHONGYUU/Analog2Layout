<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470">
  <rect width="700" height="470" fill="#f8fafc"/>
  <text x="32" y="42" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#0f172a">C1_CC — MOM capacitor</text>
  <text x="32" y="66" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#475569">fixed layout block: 5 µm × 10 µm = 50 µm²</text>
  <!-- 5 x 10 block at 30 px/um: 150 x 300 -->
  <rect x="250" y="90" width="150" height="300" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="325" y="235" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">C1_CC</text>
  <text x="325" y="256" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#4c1d95">MOM 5 pF</text>
  <!-- width dim -->
  <line x1="250" y1="412" x2="400" y2="412" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="250" y1="406" x2="250" y2="418" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="400" y1="406" x2="400" y2="418" stroke="#0f172a" stroke-width="1.5"/>
  <text x="325" y="404" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0f172a">5 µm</text>
  <!-- height dim -->
  <line x1="430" y1="90" x2="430" y2="390" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="424" y1="90" x2="436" y2="90" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="424" y1="390" x2="436" y2="390" stroke="#0f172a" stroke-width="1.5"/>
  <text x="442" y="245" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#0f172a">10 µm</text>
  <text x="32" y="448" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#64748b">fixed block; density rule bypassed; block includes its own routing</text>
</svg>
